[project]
name = "branch-analyzer"
version = "0.1.0"
description = "Branch's code analyzer: estimates the time and space complexity of a solution by reading it, never running it."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.uv]
# Only packages published at least two weeks before the lock was made.
exclude-newer = "2026-10-24T00:00:00Z"

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
