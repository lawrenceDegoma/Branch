# Local development dependencies for Branch.
# Usage: pnpm db:up   (from the repository root)
name: branch

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: branch
      POSTGRES_PASSWORD: branch
      POSTGRES_DB: branch
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branch -d branch"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
