<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Branch</title>
  </head>
  <body>
    <header>
      <img src="/icon/32.png" alt="" width="20" height="20" />
      <span class="wordmark">branch<span class="dot">.</span></span>
    </header>
    <main>
      <section id="disconnected" hidden aria-labelledby="disconnected-heading">
        <h1 id="disconnected-heading">Not connected</h1>
        <p data-text="disclosure"></p>
        <p class="muted">
          To connect, choose <strong>Connect a browser</strong> in Branch's Settings. This extension
          picks up the key by itself.
        </p>
        <button type="button" id="open-settings" class="primary">
          Agree and open Branch settings
        </button>
        <form id="key-form" novalidate>
          <label for="key">Or paste a key from Branch</label>
          <div class="row">
            <input id="key" name="key" autocomplete="off" spellcheck="false" placeholder="brx_…" />
            <button type="submit">Agree and connect</button>
          </div>
        </form>
      </section>

      <section id="connected" hidden aria-labelledby="connected-heading">
        <h1 id="connected-heading">Connected</h1>
        <p id="account" class="muted"></p>
        <dl>
          <dt>Last seen</dt>
          <dd id="last-seen">Nothing yet</dd>
          <dt>Last sync</dt>
          <dd id="last-sync">Nothing yet</dd>
          <dt>Waiting to send</dt>
          <dd id="pending">None</dd>
        </dl>
        <p class="muted small" data-text="reload-hint"></p>
        <div class="row">
          <button type="button" id="retry" hidden>Retry now</button>
          <button type="button" id="disconnect">Disconnect</button>
        </div>
      </section>

      <p id="message" role="status" aria-live="polite"></p>

      <details id="what-is-sent" hidden>
        <summary>What this extension sends</summary>
        <p data-text="disclosure"></p>
      </details>
      <p class="small"><a id="privacy" target="_blank" rel="noopener">Privacy policy</a></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
